spring:
  application:
    name: MovieService

  datasource:
    url: jdbc:postgresql://db.pheqtuffhczkkgalpqtx.supabase.co:5432/postgres?sslmode=require
    username: postgres
    password: ${SUPABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://eureka:password@localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true
